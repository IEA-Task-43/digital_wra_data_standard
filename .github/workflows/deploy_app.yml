name: Deploy Form App to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'schema/**'
      - 'app/**'
      - '.github/workflows/deploy_app.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 'npm run build' copies schema/iea43_wra_data_model.schema.json into
      # app/public/schema.json first, via the prebuild script.
      - run: npm ci
        working-directory: ./app
      - run: npm run build
        working-directory: ./app

      - name: deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/build
          keep_files: true
